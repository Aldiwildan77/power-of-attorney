# Print a stack of blank forms: your details are filled in, the agent's are
# dotted lines to write by hand.
#
#   python generate.py -c examples/blank-agent-forms.toml
#   python generate.py -c examples/blank-agent-forms.toml -t skck,bank,dukcapil
#   python generate.py -c examples/blank-agent-forms.toml --all

[document]
type = "umum"
place = "Jakarta Selatan"
date = "auto"
footnote = "Isi data penerima kuasa dengan tinta hitam, huruf kapital."

[document.stamp]
enabled = true
on = "principal"

[principal]
name = "SITI RAHMAWATI"
nik = "3174054503950002"
birth = "Jakarta, 5 Maret 1995"
occupation = "Karyawan Swasta"
address = "Jl. Kebagusan Raya No. 45"
rt_rw = "004/002"
village = "Kebagusan"
district = "Pasar Minggu"
city = "Jakarta Selatan"
province = "DKI Jakarta"
phone = "0812-1111-2222"

[agent]
blank = true
# Standard rows are always there; these three are extra.
blank_fields = ["birth", "occupation", "phone"]

[output]
dir = "output/blank-forms"
pattern = "blanko-{type}.pdf"

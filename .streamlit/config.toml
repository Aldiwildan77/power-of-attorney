# Theme for app.py. A pale desk; the rendered letter is the brightest thing on
# it, held by a hairline border and a soft shadow.
[theme]
base = "light"
primaryColor = "#2F5FD0"
backgroundColor = "#F4F6F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#141A23"

[client]
# No developer menu in production; errors go to the server log, not the page.
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false

[server]
headless = true
enableXsrfProtection = true
# The app uploads nothing bigger than a config file.
maxUploadSize = 5
